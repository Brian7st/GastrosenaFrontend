<aside class="sidebar" [class.collapsed]="collapsed">

  <div class="sidebar__header">
    <a routerLink="/dashboard" class="sidebar__brand" *ngIf="!collapsed">
      <div class="sidebar__brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white"
             stroke-width="2" stroke-linecap="round">
          <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2M7 2v20M21 15V2a5 5 0 00-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>
        </svg>
      </div>
      <div>
        <p class="sidebar__brand-name">GastroSENA</p>
        <p class="sidebar__brand-sub">Sistema de Gestión</p>
      </div>
    </a>
    <button class="sidebar__toggle" (click)="collapsed = !collapsed">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="sidebar__user" *ngIf="!collapsed">
    <div class="sidebar__user-avatar">{{ userInitial }}</div>
    <div class="sidebar__user-info">
      <p class="sidebar__user-name">{{ userName }}</p>
      <span class="sidebar__user-role">{{ userRole }}</span>
    </div>
  </div>

  <nav class="sidebar__nav">
    <ul>
      <li *ngFor="let item of navItems">
        <a [routerLink]="item.route"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{exact: item.exact ?? false}"
           class="sidebar__nav-item"
           [class.collapsed]="collapsed"
           [title]="collapsed ? item.label : ''">
          <span class="sidebar__nav-icon" [innerHTML]="item.icon"></span>
          <span class="sidebar__nav-label" *ngIf="!collapsed">{{ item.label }}</span>
          <span class="sidebar__nav-badge" *ngIf="item.badge && !collapsed">{{ item.badge }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar__bottom">
    <button class="sidebar__logout" (click)="logout()" [class.collapsed]="collapsed">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
      <span *ngIf="!collapsed">Cerrar Sesión</span>
    </button>
  </div>

</aside>
