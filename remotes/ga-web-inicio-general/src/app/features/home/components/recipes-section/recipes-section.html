<section class="section" id="recetas">
  <div class="container">
    <app-section-title
      title="Recetas Tradicionales"
      subtitle="La cocina colombiana en sus mejores expresiones, preparada por nuestros aprendices."
    />
    <div class="items-grid">
      @for (item of items(); track item.id) {
        <app-card
          [title]="item.title"
          [subtitle]="item.description"
          [imageUrl]="item.imageUrl ?? ''"
        />
      }
    </div>
  </div>
</section>
