<div class="chatbot">

  <!-- Botón flotante -->
  <button class="chatbot__fab" (click)="toggleOpen()" [class.open]="isOpen()" aria-label="Abrir chat">
    @if (isOpen()) {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    } @else {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg>
    }
  </button>

  <!-- Panel del chat -->
  @if (isOpen()) {
    <div class="chatbot__panel">
      <div class="chatbot__header">
        <div class="chatbot__avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
          </svg>
        </div>
        <div>
          <p class="chatbot__name">Asistente GastroSENA</p>
          <p class="chatbot__status">En línea</p>
        </div>
      </div>

      <div class="chatbot__messages">
        @for (msg of messages(); track $index) {
          <div class="message" [class.message--user]="msg.from === 'user'" [class.message--bot]="msg.from === 'bot'">
            <p class="message__text">{{ msg.text }}</p>
          </div>
        }
        @if (isLoading()) {
          <div class="message message--bot">
            <p class="message__text message__text--typing">
              <span></span><span></span><span></span>
            </p>
          </div>
        }
      </div>

      <div class="chatbot__input">
        <input
          type="text"
          placeholder="Escribe tu pregunta..."
          [value]="inputText()"
          (input)="inputText.set($any($event.target).value)"
          (keydown)="onKeydown($event)"
          [disabled]="isLoading()"
        />
        <button class="chatbot__send" (click)="sendMessage()" [disabled]="isLoading()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
    </div>
  }

</div>
