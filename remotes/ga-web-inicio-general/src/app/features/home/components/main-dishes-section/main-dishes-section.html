<section class="section" id="platos-principales">
  <div class="container">
    <app-section-title
      title="Platos Principales"
      subtitle="Cortes premium, proteínas selectas y combinaciones irresistibles de nuestra cocina de autor."
    />
    <div class="dishes-grid">
      @for (item of items(); track item.id) {
        <div class="dish-card">
          @if (item.imageUrl) {
            <div class="dish-card__img">
              <img [src]="item.imageUrl" [alt]="item.title" loading="lazy" />
            </div>
          }
          <div class="dish-card__body">
            <h3 class="dish-card__title">{{ item.title }}</h3>
            <p  class="dish-card__desc">{{ item.description }}</p>
            @if (item.price) {
              <span class="dish-card__price">{{ item.price | currency:'COP':'symbol':'1.0-0' }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
