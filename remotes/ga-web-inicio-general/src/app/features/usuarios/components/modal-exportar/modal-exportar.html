<div class="modal-overlay" (click)="cerrar.emit()">
  <div class="modal" (click)="$event.stopPropagation()">

    <div class="modal__header">
      <div class="modal__header-icon modal__header-icon--blue">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
      </div>
      <h2 class="modal__title">Exportar Usuarios</h2>
      <button class="modal__close" (click)="cerrar.emit()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="modal__body">

      <div class="form-group">
        <label class="form-label">Formato de exportación</label>
        <select class="form-input" [(ngModel)]="formato">
          <option value="xlsx">Excel (.xlsx)</option>
          <option value="csv">CSV (.csv)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Filtros de exportación</label>
        <div class="checkbox-wrap">
          <input type="checkbox" id="incluirInactivos" [(ngModel)]="incluirInactivos">
          <label for="incluirInactivos">Incluir usuarios inactivos</label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Filtrar por rol</label>
        <select class="form-input" [(ngModel)]="filtroRol">
          <option value="">Todos los roles</option>
          <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
        </select>
      </div>

      <div class="export-preview">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6"
             stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p>
          Se exportarán <strong>{{ usuarios.length }}</strong> usuarios en formato
          <strong>{{ formato.toUpperCase() }}</strong>.
        </p>
      </div>

    </div>

    <div class="modal__footer">
      <button class="btn-cancelar" (click)="cerrar.emit()">Cancelar</button>
      <button class="btn btn-exportar-action" (click)="exportar()" [disabled]="loading">
        <span *ngIf="!loading">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
          </svg>
          Exportar
        </span>
        <span *ngIf="loading" class="auth-spinner"></span>
      </button>
    </div>

  </div>
</div>
