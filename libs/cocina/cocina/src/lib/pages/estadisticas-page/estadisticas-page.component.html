<div class="stats-container">
  
  <!-- KPIs Header -->
  <div class="kpis-grid">
    <div class="kpi-card shadow-sm">
      <div class="kpi-icon icon-espera">
        <i class="bi bi-clock-history"></i>
      </div>
      <div class="kpi-info">
        <h3>Promedio General</h3>
        <p class="kpi-value">{{ kpis()?.promedioDemoraGeneral || 0 }} min</p>
      </div>
    </div>

    <div class="kpi-card shadow-sm">
      <div class="kpi-icon icon-listo">
        <i class="bi bi-lightning-charge-fill"></i>
      </div>
      <div class="kpi-info">
        <h3>Plato Más Rápido</h3>
        <p class="kpi-value text-sm">{{ kpis()?.platoMasRapido || '—' }}</p>
      </div>
    </div>

    <div class="kpi-card shadow-sm">
      <div class="kpi-icon icon-preparando">
        <i class="bi bi-check2-all"></i>
      </div>
      <div class="kpi-info">
        <h3>Total Despachados</h3>
        <p class="kpi-value">{{ kpis()?.totalPlatosDespachadosHoy || 0 }}</p>
      </div>
    </div>
  </div>

  <!-- Gráficos -->
  <div class="charts-grid">
    <div class="chart-card shadow-sm">
      <h3>Demora Promedio por Plato</h3>
      <div class="chart-wrapper">
        <canvas #graficoPromedios></canvas>
      </div>
    </div>

    <div class="chart-card shadow-sm">
      <h3>Carga de Trabajo del Día</h3>
      <div class="chart-wrapper">
        <canvas #graficoDiario></canvas>
      </div>
    </div>
  </div>

</div>
