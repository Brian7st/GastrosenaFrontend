<div class="comanda-container">

  @if (errorToast()) {
  <div class="toast-error shadow">
    <i class="bi bi-exclamation-triangle-fill"></i> {{ errorToast() }}
  </div>
  }

  <!-- Filtros -->
  <div class="filters-container">
    <div class="search-wrapper">
      <i class="bi bi-search"></i>
      <input type="text" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)"
        placeholder="Buscar por mesa, mesero o plato..." class="search-bar">
    </div>

    <select [ngModel]="filtroEstado()" (ngModelChange)="filtroEstado.set($event)" class="filter-select">
      <option>Todos los estados</option>
      <option>En Espera</option>
      <option>Preparando</option>
      <option>Listo</option>
    </select>

    <select [ngModel]="filtroPrioridad()" (ngModelChange)="filtroPrioridad.set($event)" class="filter-select">
      <option>Todas las prioridades</option>
      <option>Urgente</option>
      <option>Alta</option>
      <option>Normal</option>
    </select>

    <select [ngModel]="filtroOrden()" (ngModelChange)="filtroOrden.set($event)" class="filter-select">
      <option>Prioridad</option>
      <option>Hora de llegada</option>
      <option>Tiempo estimado</option>
    </select>
  </div>

  <div class="comandas-grid">

    <div class="column col-espera">
      <div class="col-header">
        <span><i class="bi bi-clock-history"></i> En Espera</span>
        <span class="counter">{{ enEspera().length }}</span>
      </div>
      @for (c of enEspera(); track c.idComanda) {
      <restaurant-comanda-card class="comanda-card-wrapper shadow-sm" [comanda]="c"
        (onIniciarPlato)="onIniciarPlato($event, c.idComanda)"
        (onFinalizarPlato)="onFinalizarPlato($event, c.idComanda)">
      </restaurant-comanda-card>
      }
    </div>

    <div class="column col-preparando">
      <div class="col-header">
        <span><i class="bi bi-play-circle-fill"></i> Preparando</span>
        <span class="counter">{{ preparando().length }}</span>
      </div>
      @for (c of preparando(); track c.idComanda) {
      <restaurant-comanda-card class="comanda-card-wrapper shadow-sm" [comanda]="c"
        (onIniciarPlato)="onIniciarPlato($event, c.idComanda)"
        (onFinalizarPlato)="onFinalizarPlato($event, c.idComanda)">
      </restaurant-comanda-card>
      }
    </div>

    <div class="column col-listo">
      <div class="col-header">
        <span><i class="bi bi-check-circle-fill"></i> Listo</span>
        <span class="counter">{{ listos().length }}</span>
      </div>
      @for (c of listos(); track c.idComanda) {
      <restaurant-comanda-card class="comanda-card-wrapper shadow-sm card-completed" [comanda]="c"
        (onIniciarPlato)="onIniciarPlato($event, c.idComanda)"
        (onFinalizarPlato)="onFinalizarPlato($event, c.idComanda)">
      </restaurant-comanda-card>
      }
    </div>

  </div>
</div>
