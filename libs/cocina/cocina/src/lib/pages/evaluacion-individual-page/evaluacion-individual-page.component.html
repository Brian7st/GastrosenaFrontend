<div class="evaluacion-container" (click)="cerrarMenuEvaluar()">

  <!-- ===== CABECERA ===== -->
  <div class="page-header">
    <button id="btn-volver-individual" class="back-btn" type="button" (click)="volver(); $event.stopPropagation()" aria-label="Volver">
      <lucide-icon name="arrow-left" [size]="20"></lucide-icon>
    </button>
    <h1 class="page-title">Evaluación Individual</h1>
  </div>

  <!-- ===== TARJETA APRENDIZ ===== -->
  <div class="card aprendiz-card">

    <!-- Perfil -->
    <div class="aprendiz-perfil">
      <div class="avatar-lg">{{ aprendiz().inicial }}</div>
      <div class="aprendiz-info">
        <p class="aprendiz-nombre">{{ aprendiz().nombreCompleto }}</p>
        <p class="aprendiz-doc">{{ aprendiz().documento }}</p>
      </div>
    </div>

    <hr class="divider" />

    <!-- Metadatos: 3 columnas -->
    <div class="meta-grid">
      <div class="meta-item">
        <span class="meta-label">Jornada</span>
        <span class="meta-value meta-value--primary">{{ aprendiz().jornada }}</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Número de Ficha</span>
        <span class="meta-value">{{ aprendiz().numeroFicha }}</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Actividad</span>
        <span class="meta-value">{{ aprendiz().actividad ?? '—' }}</span>
      </div>
    </div>

    <hr class="divider" />

    <!-- Observaciones -->
    <div class="obs-section">
      <div class="obs-header">
        <span class="obs-icon">📋</span>
        <span class="obs-title">Observaciones</span>
      </div>

      <div class="obs-body">
        <textarea
          id="textarea-observaciones"
          class="obs-textarea"
          rows="4"
          placeholder="Anote observaciones sobre el desempeño del aprendiz en esta actividad..."
          [(ngModel)]="observaciones"
          (click)="$event.stopPropagation()"
        ></textarea>

        <!-- Botón EVALUAR (desplegable hacia arriba) -->
        <div class="evaluar-dropdown-wrapper" (click)="$event.stopPropagation()">

          @if (menuEvaluarAbierto()) {
            <div class="evaluar-menu" role="menu" aria-label="Opciones de evaluación">
              <button
                id="btn-aprobo-individual"
                class="evaluar-option evaluar-option--aprobo"
                type="button"
                role="menuitem"
                (click)="submitEvaluacionIndividual('aprobo')"
              >
                <span class="option-icon">✓</span> Aprobó
              </button>
              <button
                id="btn-no-aprobo-individual"
                class="evaluar-option evaluar-option--no-aprobo"
                type="button"
                role="menuitem"
                (click)="submitEvaluacionIndividual('no_aprobo')"
              >
                <span class="option-icon">✗</span> No Aprobó
              </button>
            </div>
          }

          <button
            id="btn-evaluar-individual"
            class="btn-evaluar"
            type="button"
            (click)="toggleMenuEvaluar()"
            [attr.aria-expanded]="menuEvaluarAbierto()"
            aria-haspopup="menu"
          >
            EVALUAR
            <span class="evaluar-caret" [class.caret-up]="menuEvaluarAbierto()">▲</span>
          </button>

        </div>
      </div>
    </div>

  </div><!-- /aprendiz-card -->

</div>
