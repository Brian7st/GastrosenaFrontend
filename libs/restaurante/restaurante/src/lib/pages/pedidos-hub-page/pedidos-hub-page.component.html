<div class="pedidos-hub-page">
  <div class="back-action">
    <restaurant-button variant="ghost" routerLink="../pedidos">
      <lucide-icon name="arrow-left" [size]="18"></lucide-icon>
      <span>Volver a Pedidos</span>
    </restaurant-button>
  </div>

  <restaurant-page-header 
    title="Centro de Pedidos"
    subtitle="Selecciona el panel de gestión según tu rol">
  </restaurant-page-header>

  <div class="pedidos-hub-page__grid">
    <restaurant-card class="hub-card" routerLink="../historial-instructor">
      <div class="hub-card__content">
        <div class="hub-card__icon-wrapper instructor-icon">
          <lucide-icon name="clipboard-list" [size]="48"></lucide-icon>
        </div>
        <h3 class="hub-card__title">Ver pedidos (Instructor)</h3>
        <p class="hub-card__description">Supervisa y administra todos los pedidos realizados por los aprendices en el salón.</p>
      </div>
    </restaurant-card>

    <restaurant-card class="hub-card" routerLink="../historial-estudiante">
      <div class="hub-card__content">
        <div class="hub-card__icon-wrapper student-icon">
          <lucide-icon name="user" [size]="48"></lucide-icon>
        </div>
        <h3 class="hub-card__title">Mis Pedidos (Aprendiz)</h3>
        <p class="hub-card__description">Revisa el historial de pedidos que has tomado durante tu turno actual.</p>
      </div>
    </restaurant-card>
  </div>
</div>
