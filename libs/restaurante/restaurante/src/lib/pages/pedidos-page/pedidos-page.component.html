<div class="pedidos-layout">
  <!-- Área Principal (Izquierda) -->
  <main class="pedidos-main">
    <header class="pedidos-header">
      <div class="header-left">
        <button class="back-btn" (click)="volverAMesas()">
          <lucide-icon name="arrow-left" [size]="20"></lucide-icon>
        </button>
        @if (mesaActual(); as mesa) {
          <div class="mesa-info">
            <h2>{{ mesa.nombre }}</h2>
            <!-- comensal eliminado del modelo Mesa (TODO: leer del Pedido activo en fase siguiente) -->
          </div>
        }
      </div>

      <div class="search-bar">
        <lucide-icon name="search" [size]="18" class="search-icon"></lucide-icon>
        <input type="text" placeholder="Buscar platillo..." [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" />
      </div>

      <div class="historial-action">
        <restaurant-button variant="surface" routerLink="../historial-pedidos">
          <lucide-icon name="clipboard-list" [size]="18"></lucide-icon>
          <span>Historial</span>
        </restaurant-button>
      </div>
      
      <div class="user-profile">
        <div class="user-info">
          <span class="user-name">Cajero Principal</span>
          <span class="date">{{ fechaActual | date:'mediumDate' }}</span>
        </div>
        <div class="avatar">
          <lucide-icon name="user" [size]="20" color="var(--color-text-secondary)"></lucide-icon>
        </div>
      </div>
    </header>

    <section class="categories-section">
      <lib-pedidos-categories
        (categorySelected)="selectedCategory.set($event)"
        (subcategorySelected)="selectedSubcategory.set($event)">
      </lib-pedidos-categories>
    </section>

    <section class="menu-section">
      <lib-pedidos-menu-grid 
        [searchTerm]="searchTerm()"
        [category]="selectedCategory()"
        [subcategory]="selectedSubcategory()">
      </lib-pedidos-menu-grid>
    </section>
  </main>

  <!-- Overlay para móvil -->
  @if (showMobileCart()) {
    <div class="mobile-cart-backdrop" (click)="showMobileCart.set(false)"></div>
  }

  <!-- Área del Carrito (Derecha / Drawer en móvil) -->
  <aside class="pedidos-sidebar" [class.mobile-open]="showMobileCart()">
    <div class="mobile-drawer-header">
      <h3>Resumen del Pedido</h3>
      <button class="close-drawer-btn" (click)="showMobileCart.set(false)">
        <lucide-icon name="x" [size]="24"></lucide-icon>
      </button>
    </div>
    <lib-pedidos-cart></lib-pedidos-cart>
  </aside>

  <!-- Botón flotante para abrir el carrito en móvil -->
  <button class="mobile-cart-fab" (click)="showMobileCart.set(true)">
    <div class="fab-content">
      <lucide-icon name="clipboard-list" [size]="24"></lucide-icon>
      <span>Ver Carrito</span>
    </div>
    @if (totalItems() > 0) {
      <span class="fab-badge">{{ totalItems() }}</span>
    }
  </button>
</div>
