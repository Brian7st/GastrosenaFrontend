<div class="pedidos-layout">
  <!-- Área Principal (Izquierda) -->
  <main class="pedidos-main">
    <header class="pedidos-header">
      <div class="header-left">
        <button class="back-btn" (click)="volverAMesas()">
          <lucide-icon name="arrow-left" [size]="20"></lucide-icon>
        </button>
        @if (mesaActual(); as mesa) {
        <div class="mesa-info">
          <h2>{{ mesa.nombre }}</h2>
          <!-- comensal eliminado del modelo Mesa (TODO: leer del Pedido activo en fase siguiente) -->
        </div>
        }
      </div>

      <div class="search-bar">
        <lucide-icon name="search" [size]="18" class="search-icon"></lucide-icon>
        <input type="text" [placeholder]="i18n.t('pedidosPage.searchPlaceholder')" [ngModel]="searchTerm()"
          (ngModelChange)="searchTerm.set($event)" />
      </div>

      <div class="historial-action">
        <restaurant-button variant="surface" routerLink="../historial-pedidos">
          <lucide-icon name="clipboard-list" [size]="18"></lucide-icon>
          <span>{{ i18n.t('pedidosPage.history') }}</span>
        </restaurant-button>
      </div>

      <div class="user-profile">
        <div class="user-info">
          <span class="user-name">{{ nombreUsuario() }}</span>
          <span class="date">{{ fechaActual | date:'mediumDate' }}</span>
        </div>
        <div class="avatar">
          <lucide-icon name="user" [size]="20" color="var(--color-text-secondary)"></lucide-icon>
        </div>
      </div>
    </header>

    <div [style.pointer-events]="esPedidoSoloLectura() ? 'none' : 'auto'"
      [style.opacity]="esPedidoSoloLectura() ? '0.5' : '1'">
      <section class="categories-section">
        <lib-pedidos-categories 
          [categories]="facade.categoriasMenu()"
          (filterChanged)="onFilterChanged($event)">
        </lib-pedidos-categories>
      </section>

      <section class="menu-section">
        <lib-pedidos-menu-grid 
          [searchTerm]="searchTerm()" 
          [mainCategory]="selectedMainCategory()"
          [subCategory]="selectedSubCategory()">
        </lib-pedidos-menu-grid>
      </section>
    </div>
  </main>

  <!-- Área del Carrito (Derecha) -->
  <aside class="pedidos-sidebar">
    <lib-pedidos-cart></lib-pedidos-cart>
  </aside>
</div>

<restaurant-confirm-dialog
  [open]="mostrarModalAccesoDenegado()"
  [title]="i18n.t('pedidosPage.accessDeniedTitle')"
  [message]="i18n.t('pedidosPage.accessDeniedMessage')"
  [confirmText]="i18n.t('pedidosPage.accessDeniedConfirm')"
  [showCancel]="false"
  (confirm)="cerrarModalAccesoDenegado()"
></restaurant-confirm-dialog>
