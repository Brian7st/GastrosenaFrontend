<div class="categories-header">
  <h2>{{ i18n.t('pedidosCategories.title') }}</h2>
</div>

<!-- Main Categories -->
<div class="categories-list">
  @for (cat of categories(); track cat.id) {
    <div
      class="category-card"
      [class.active]="activeCategory() === cat.id"
      (click)="selectCategory(cat.id)"
    >
      <div class="icon">
        <lucide-icon [name]="cat.icon" [size]="24"></lucide-icon>
      </div>
      <span class="name">{{ cat.name }}</span>
    </div>
  }
</div>

<!-- Subcategories (bebidas) -->
@if (activeCategory() === 'bebidas') {
  <div class="subcategories-list">
    @for (sub of subcategoriesBebidas(); track sub.id) {
      <div
        class="subcategory-chip"
        [class.active]="activeSubcategory() === sub.id"
        (click)="selectSubcategory(sub.id)"
      >
        {{ sub.name }}
      </div>
    }
  </div>
}
