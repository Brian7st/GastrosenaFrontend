<div class="menu-header">
  <h2>Menú</h2>
</div>

<div class="menu-grid">
  @for (product of products; track product.id) {
    <restaurant-card class="product-card" (click)="agregarProducto(product)">
      <div class="image-container">
        <img [src]="product.image" [alt]="product.name" loading="lazy" />
        @if (product.discount) {
          <restaurant-status-badge class="discount-badge" [label]="product.discount" variant="info"></restaurant-status-badge>
        }
      </div>
      <div class="info-container">
        <h3 class="product-name">{{ product.name }}</h3>
        <p class="stats">{{ product.available }} Disponibles • {{ product.sold }} Vendidos</p>
        <div class="price-row">
          <div class="prices">
            @if (product.originalPrice) {
              <span class="original-price">{{ product.originalPrice | currencyCop }}</span>
            }
            <span class="current-price">{{ product.price | currencyCop }}</span>
          </div>
          <span class="unit">/ Porción</span>
        </div>
      </div>
    </restaurant-card>
  }
</div>

<restaurant-confirm-dialog
  [open]="showNoTableModal()"
  title="Mesa no asignada"
  message="Debes tener una mesa asignada para poder agregar productos al pedido."
  confirmText="Ir a mesas"
  [showCancel]="false"
  (confirm)="irAMesas()"
  (cancel)="showNoTableModal.set(false)"
></restaurant-confirm-dialog>
