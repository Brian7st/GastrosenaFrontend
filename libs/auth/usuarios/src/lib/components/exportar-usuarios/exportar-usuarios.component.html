<div class="modal-backdrop" (click)="cerrar.emit()" (keydown.escape)="cerrar.emit()" role="dialog" aria-modal="true" tabindex="-1">
  <div class="modal" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal__header">
      <div class="modal__header-icon modal__header-icon--export">
        <lucide-icon name="download" [size]="20"></lucide-icon>
      </div>
      <div>
        <h2 class="modal__title">{{ i18n.t('exportar.titulo') }}</h2>
        <p class="modal__subtitle">{{ i18n.t('exportar.subtitulo') }}</p>
      </div>
      <button class="modal__close" type="button" (click)="cerrar.emit()" [attr.aria-label]="i18n.t('exportar.cerrar')">
        <lucide-icon name="x" [size]="18"></lucide-icon>
      </button>
    </div>

    <!-- Body -->
    <div class="modal__body">

      <!-- Formato -->
      <div class="modal__field">
        <label class="modal__label" for="exp-formato">{{ i18n.t('exportar.formato') }}</label>
        <div class="modal__select-wrapper">
          <select
            id="exp-formato"
            class="modal__select"
            [value]="formato()"
            (change)="onFormatoChange($event)"
          >
            <option value="excel">{{ i18n.t('exportar.excel') }}</option>
            <option value="csv">{{ i18n.t('exportar.csv') }}</option>
          </select>
          <lucide-icon name="chevron-down" [size]="16" class="modal__select-icon"></lucide-icon>
        </div>
      </div>

      <!-- Filtro por rol -->
      <div class="modal__field">
        <label class="modal__label" for="exp-rol">{{ i18n.t('exportar.filtrar_rol') }}</label>
        <div class="modal__select-wrapper">
          <select
            id="exp-rol"
            class="modal__select"
            [value]="filtroRol()"
            (change)="onRolChange($event)"
          >
            @for (opcion of rolOpciones(); track opcion.value) {
              <option [value]="opcion.value">{{ opcion.label }}</option>
            }
          </select>
          <lucide-icon name="chevron-down" [size]="16" class="modal__select-icon"></lucide-icon>
        </div>
      </div>

      <!-- Incluir inactivos -->
      <label class="modal__checkbox">
        <input
          type="checkbox"
          class="modal__checkbox-input"
          [checked]="incluirInactivos()"
          (change)="onInactivosChange($event)"
        />
        <span class="modal__checkbox-label">{{ i18n.t('exportar.incluir_inactivos') }}</span>
      </label>

      <!-- Info -->
      <div class="modal__info">
        <lucide-icon name="info" [size]="16" class="modal__info-icon"></lucide-icon>
        <p class="modal__info-text">
          {{ i18n.t('exportar.info') }}
          <strong>{{ totalUsuarios }} {{ i18n.t('exportar.usuarios') }}</strong>
          {{ i18n.t('exportar.con_filtros') }}
        </p>
      </div>

    </div>

    <!-- Footer -->
    <div class="modal__footer">
      <button class="modal__btn modal__btn--ghost" type="button" (click)="cerrar.emit()">
        {{ i18n.t('exportar.cancelar') }}
      </button>
      <button class="modal__btn modal__btn--primary" type="button" (click)="onExportar()">
        <lucide-icon name="download" [size]="16"></lucide-icon>
        {{ i18n.t('exportar.exportar') }}
      </button>
    </div>

  </div>
</div>
