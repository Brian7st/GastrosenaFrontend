<div class="comanda-container">
  <restaurant-page-header title="Tablero de Comandas - Bar y Barismo" subtitle="Gestión de bebidas en tiempo real"></restaurant-page-header>

  @if (errorToast()) {
  <div class="toast-error shadow">
    <i class="bi bi-exclamation-triangle-fill"></i> {{ errorToast() }}
  </div>
  }

  <!-- Filtros -->
  <div class="filters-container showcase__row" style="margin-bottom: var(--space-6);">
    <div style="flex: 1; min-width: 250px;">
      <restaurant-search-filter 
        label="Buscar comanda" 
        placeholder="Buscar por mesa, mesero o bebida..." 
        [value]="searchTerm()" 
        (valueChange)="searchTerm.set($event)"
      ></restaurant-search-filter>
    </div>

    <div style="min-width: 180px;">
      <restaurant-select-filter 
        label="Estado" 
        [value]="filtroEstado()" 
        [options]="opcionesEstado" 
        (valueChange)="filtroEstado.set($event)"
      ></restaurant-select-filter>
    </div>

    <div style="min-width: 180px;">
      <restaurant-select-filter 
        label="Prioridad" 
        [value]="filtroPrioridad()" 
        [options]="opcionesPrioridad" 
        (valueChange)="filtroPrioridad.set($event)"
      ></restaurant-select-filter>
    </div>

    <div style="min-width: 180px;">
      <restaurant-select-filter 
        label="Ordenar por" 
        [value]="filtroOrden()" 
        [options]="opcionesOrden" 
        (valueChange)="filtroOrden.set($event)"
      ></restaurant-select-filter>
    </div>
  </div>

  <div class="comandas-grid">

    <div class="column col-espera">
      <div class="col-header showcase__row" style="justify-content: space-between; margin-bottom: var(--space-4);">
        <restaurant-section-title title="En Espera" align="left"></restaurant-section-title>
        <span class="showcase__value">{{ enEspera().length }}</span>
      </div>
      @for (c of enEspera(); track c.idComanda) {
        <restaurant-comanda-card class="comanda-card-wrapper shadow-sm" [comanda]="c"
          (iniciarPlato)="onIniciarPlato($event)"
          (finalizarPlato)="onFinalizarPlato($event)">
        </restaurant-comanda-card>
      }
    </div>

    <div class="column col-preparando">
      <div class="col-header showcase__row" style="justify-content: space-between; margin-bottom: var(--space-4);">
        <restaurant-section-title title="Preparando" align="left"></restaurant-section-title>
        <span class="showcase__value">{{ preparando().length }}</span>
      </div>
      @for (c of preparando(); track c.idComanda) {
        <restaurant-comanda-card class="comanda-card-wrapper shadow-sm" [comanda]="c"
          (iniciarPlato)="onIniciarPlato($event)"
          (finalizarPlato)="onFinalizarPlato($event)">
        </restaurant-comanda-card>
      }
    </div>

    <div class="column col-listo">
      <div class="col-header showcase__row" style="justify-content: space-between; margin-bottom: var(--space-4);">
        <restaurant-section-title title="Listo" align="left"></restaurant-section-title>
        <span class="showcase__value">{{ listos().length }}</span>
      </div>
      @for (c of listos(); track c.idComanda) {
        <restaurant-comanda-card class="comanda-card-wrapper shadow-sm card-completed" [comanda]="c"
          (iniciarPlato)="onIniciarPlato($event)"
          (finalizarPlato)="onFinalizarPlato($event)">
        </restaurant-comanda-card>
      }
    </div>

  </div>
</div>
