<div class="page-container">

  <!-- ── Action Header ──────────────────────────────────────────────────── -->
  <header class="action-header">
    <div class="header-left">
      <inventario-back-button (clicked)="volver()"></inventario-back-button>
      <div>
        <h1 class="page-title">{{ i18n.t('alerta.config_titulo') }}</h1>
        <p class="page-subtitle">{{ i18n.t('alerta.config_subtitulo') }}</p>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-save" (click)="guardarConfig()">
        <span class="material-symbols-outlined">save</span>
        {{ i18n.t('alerta.guardar_config') }}
      </button>
    </div>
  </header>

  <!-- ── Lista de ítems ─────────────────────────────────────────────────── -->
  <div class="umbrales-list">
    @for (umbral of umbrales(); track umbral.id) {
      <div class="umbral-item" [class.umbral-item--alerta]="umbral.enAlerta">

        <!-- Ícono y nombre del bien -->
        <div class="umbral-item__bien">
          <div class="umbral-item__icon-wrap" [class.umbral-item__icon-wrap--alerta]="umbral.enAlerta">
            <span class="material-symbols-outlined">{{ umbral.icono }}</span>
          </div>
          <div>
            <p class="umbral-item__nombre">{{ umbral.bien }}</p>
            <p class="umbral-item__categoria">{{ umbral.categoria }}</p>
            @if (umbral.enAlerta) {
              <span class="umbral-item__alerta-badge">{{ umbral.categoria }}</span>
            }
          </div>
        </div>

        <!-- Stock Mínimo -->
        <div class="umbral-item__field">
          <label class="field-label" [class.field-label--alerta]="umbral.enAlerta">
            {{ i18n.t('alerta.stock_minimo_label') }}
          </label>
          <input
            type="number"
            class="field-input"
            [class.field-input--alerta]="umbral.enAlerta"
            [value]="umbral.stockMinimo"
            (change)="updateStockMinimo(umbral.id, $event)"
            min="0"
          />
        </div>

        <!-- Toggle Alerta Email -->
        <div class="umbral-item__field umbral-item__field--center">
          <label class="field-label">{{ i18n.t('alerta.alerta_email') }}</label>
          <label class="toggle" [class.toggle--disabled]="!umbral.emailActivo">
            <input
              type="checkbox"
              [checked]="umbral.emailActivo"
              (change)="toggleEmail(umbral.id)"
            />
            <span class="toggle__track"></span>
            <span class="toggle__thumb"></span>
          </label>
        </div>

        <!-- Correos -->
        <div class="umbral-item__field umbral-item__field--correos">
          <label class="field-label" [class.field-label--dim]="!umbral.emailActivo">{{ i18n.t('alerta.correo_destino') }}</label>
          <input
            type="text"
            class="field-input"
            [class.field-input--disabled]="!umbral.emailActivo"
            [value]="umbral.correos"
            [placeholder]="umbral.emailActivo ? 'email@empresa.com' : i18n.t('alerta.desactivada')"
            [disabled]="!umbral.emailActivo"
            (change)="updateCorreos(umbral.id, $event)"
          />
        </div>

      </div>
    }
  </div>

</div>
