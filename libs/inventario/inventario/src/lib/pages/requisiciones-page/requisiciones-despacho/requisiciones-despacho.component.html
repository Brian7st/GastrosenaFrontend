<!-- Overlay Backdrop -->
<div class="sheet-overlay" (click)="close()"></div>

<!-- DRAWER: Despacho Físico -->
<aside class="sheet-drawer">
  <!-- Header -->
  <header class="sheet-drawer__header">
    <div class="sheet-drawer__title-row">
      <div class="sheet-drawer__title-group">
        <lucide-icon name="truck" [size]="24" class="sheet-drawer__title-icon"></lucide-icon>
        <span class="sheet-drawer__title">Despacho Físico</span>
      </div>
      <button class="sheet-drawer__close" (click)="close()">
        <lucide-icon name="x" [size]="20"></lucide-icon>
      </button>
    </div>
    <div class="sheet-drawer__info-row">
      <div class="sheet-drawer__info-card sheet-drawer__info-card--primary">
        <span class="sheet-drawer__info-label">Orden de Requisición</span>
        <span class="sheet-drawer__info-value">REQ-2024-0892</span>
      </div>
      <div class="sheet-drawer__info-card">
        <span class="sheet-drawer__info-label">Centro de Costo</span>
        <span class="sheet-drawer__info-value">Gastronomía 102</span>
      </div>
    </div>
  </header>

  <!-- Scrollable Content: Checklist -->
  <div class="sheet-drawer__body">
    <h4 class="section-label">Ítems por Despachar</h4>
    <div class="checklist">

      <!-- Item 1 -->
      <label class="checklist-item">
        <div class="checklist-item__check">
          <input class="checklist-item__input" type="checkbox"/>
          <div class="checklist-item__box">
            <lucide-icon name="check" [size]="14"></lucide-icon>
          </div>
        </div>
        <div class="checklist-item__body">
          <div class="checklist-item__row">
            <div class="checklist-item__info">
              <span class="checklist-item__name">Harina de Trigo Fortificada</span>
              <span class="checklist-item__code">Cod: ALIM-0012 | Lote: 2405-A</span>
              <span class="checklist-item__qty-label">Pedido: 10 Kg</span>
            </div>
            <div class="checklist-item__delivery">
              <span class="checklist-item__delivery-label">Cant. Entregada</span>
              <input class="checklist-item__delivery-input" type="number" value="10"/>
            </div>
          </div>
        </div>
      </label>

      <!-- Item 2 -->
      <label class="checklist-item">
        <div class="checklist-item__check">
          <input class="checklist-item__input" type="checkbox"/>
          <div class="checklist-item__box">
            <lucide-icon name="check" [size]="14"></lucide-icon>
          </div>
        </div>
        <div class="checklist-item__body">
          <div class="checklist-item__row">
            <div class="checklist-item__info">
              <span class="checklist-item__name">Aceite Vegetal (Girasol)</span>
              <span class="checklist-item__code">Cod: ALIM-0045 | Lote: 2401-B</span>
              <span class="checklist-item__qty-label">Pedido: 5 Lts</span>
            </div>
            <div class="checklist-item__delivery">
              <span class="checklist-item__delivery-label">Cant. Entregada</span>
              <input class="checklist-item__delivery-input" type="number" value="5"/>
            </div>
          </div>
        </div>
      </label>

      <!-- Item 3 -->
      <label class="checklist-item">
        <div class="checklist-item__check">
          <input class="checklist-item__input" type="checkbox"/>
          <div class="checklist-item__box">
            <lucide-icon name="check" [size]="14"></lucide-icon>
          </div>
        </div>
        <div class="checklist-item__body">
          <div class="checklist-item__row">
            <div class="checklist-item__info">
              <span class="checklist-item__name">Sal Marina Refinada</span>
              <span class="checklist-item__code">Cod: ALIM-0009 | Lote: N/A</span>
              <span class="checklist-item__qty-label">Pedido: 2 Kg</span>
            </div>
            <div class="checklist-item__delivery">
              <span class="checklist-item__delivery-label">Cant. Entregada</span>
              <input class="checklist-item__delivery-input" type="number" value="2"/>
            </div>
          </div>
        </div>
      </label>

      <!-- Item 4 (Stock Alert) -->
      <label class="checklist-item checklist-item--alert">
        <div class="checklist-item__check">
          <input class="checklist-item__input" type="checkbox"/>
          <div class="checklist-item__box checklist-item__box--alert">
            <lucide-icon name="check" [size]="14"></lucide-icon>
          </div>
        </div>
        <div class="checklist-item__body">
          <div class="checklist-item__row">
            <div class="checklist-item__info">
              <span class="checklist-item__name">Papel Vinipel Industrial</span>
              <span class="checklist-item__stock-badge">Stock Crítico en Bodega</span>
              <span class="checklist-item__qty-label checklist-item__qty-label--alert">Pedido: 1 Rollo</span>
            </div>
            <div class="checklist-item__delivery">
              <span class="checklist-item__delivery-label">Cant. Entregada</span>
              <input class="checklist-item__delivery-input checklist-item__delivery-input--alert" type="number" step="0.1" value="0.5"/>
              <span class="checklist-item__delivery-pending">-0.5 Rollo pendientes</span>
            </div>
          </div>
        </div>
      </label>
    </div>

    <!-- Warehouse Details -->
    <h4 class="section-label section-label--mt">Registro de Entrega</h4>
    <div class="form-grid">
      <div class="form-field">
        <label class="form-field__label">Hora de Entrega Real</label>
        <div class="form-field__input-wrapper">
          <lucide-icon name="clock" [size]="16" class="form-field__icon"></lucide-icon>
          <input class="form-field__input" type="time" value="14:30"/>
        </div>
      </div>
      <div class="form-field">
        <label class="form-field__label">Ecónomo Responsable</label>
        <div class="form-field__input-wrapper">
          <lucide-icon name="user" [size]="16" class="form-field__icon"></lucide-icon>
          <select class="form-field__input form-field__input--select">
            <option>Carlos Rodríguez</option>
            <option>Marta Lucía Paz</option>
            <option>Jorge Iván Tobón</option>
          </select>
        </div>
      </div>
    </div>
    <div class="form-field form-field--full">
      <label class="form-field__label">Observaciones de Bodega</label>
      <textarea class="form-field__textarea" placeholder="Ej: Se entrega empaque sellado, requiere refrigeración..."></textarea>
    </div>
  </div>

  <!-- Footer Action -->
  <footer class="sheet-drawer__footer">
    <button class="sheet-drawer__cta" (click)="close()">
      <lucide-icon name="check-circle" [size]="24"></lucide-icon>
      Finalizar Entrega
    </button>
    <p class="sheet-drawer__disclaimer">Al finalizar se generará el soporte digital 45-S</p>
  </footer>
</aside>
