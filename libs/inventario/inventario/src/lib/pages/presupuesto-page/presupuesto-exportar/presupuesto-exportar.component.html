<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="header-left">
        <div class="header-icon">
          <lucide-icon name="bar-chart-3" [size]="22"></lucide-icon>
        </div>
        <div>
          <h3 class="modal-title">Exportar Reportes de Ejecución</h3>
          <p class="modal-subtitle">Configure los filtros para generar su informe detallado</p>
        </div>
      </div>
      <button class="close-btn" (click)="closeModal()">
        <lucide-icon name="x" [size]="20"></lucide-icon>
      </button>
    </div>

    <div class="modal-body">
      <p class="placeholder-text">Formulario de filtros en construcción — Fase 3</p>

      <!-- Format selection -->
      <div class="format-section">
        <p class="format-label">SELECCIONE EL FORMATO DE DESCARGA</p>
        <div class="format-grid">
          <button class="format-card" [class.selected]="formatoSeleccionado() === 'excel'" (click)="setFormato('excel')">
            <div class="format-icon format-icon--excel">
              <lucide-icon name="table" [size]="22"></lucide-icon>
            </div>
            <div class="format-text">
              <span class="format-name">Generar Excel</span>
              <span class="format-ext">Archivo .xlsx</span>
            </div>
          </button>
          <button class="format-card" [class.selected]="formatoSeleccionado() === 'pdf'" (click)="setFormato('pdf')">
            <div class="format-icon format-icon--pdf">
              <lucide-icon name="file-text" [size]="22"></lucide-icon>
            </div>
            <div class="format-text">
              <span class="format-name">Generar PDF</span>
              <span class="format-ext">Archivo .pdf</span>
            </div>
          </button>
        </div>
        <p class="zese-note">
          <lucide-icon name="check-circle" [size]="14"></lucide-icon>
          Incluye retenciones ZESE
        </p>
      </div>
    </div>

    <div class="modal-footer">
      <restaurant-button variant="surface" (click)="closeModal()">Restablecer Filtros</restaurant-button>
      <restaurant-button variant="primary" (click)="onExportar()">
        <div class="btn-icon-text">
          <lucide-icon name="download" [size]="18"></lucide-icon>
          Descargar Informe
        </div>
      </restaurant-button>
    </div>
  </div>
</div>
