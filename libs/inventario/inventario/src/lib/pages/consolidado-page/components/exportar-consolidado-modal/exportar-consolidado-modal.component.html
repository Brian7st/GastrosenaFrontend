<div class="modal-overlay" (click)="onClose()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="modal-header__title-row">
        <div class="icon-box">
          <span class="material-symbols-outlined icon-box__icon">ios_share</span>
        </div>
        <h2 class="modal-header__title">Exportar Reporte para Contabilidad</h2>
      </div>
      <p class="modal-header__subtitle">Seleccione el formato de salida deseado para este consolidado</p>
    </div>

    <!-- Content: Format Selection -->
    <div class="modal-body">
      <div class="format-options">
        <!-- Option 1: Excel -->
        <button 
          class="format-card" 
          [class.format-card--active]="selectedFormat === 'excel'"
          (click)="selectedFormat = 'excel'">
          <div class="format-card__icon-wrap">
            <span class="material-symbols-outlined format-card__icon text-primary">table_chart</span>
          </div>
          <h3 class="format-card__title">Detallado Excel</h3>
          <p class="format-card__desc">
            Ideal para análisis profundo, tablas dinámicas y conciliación de partidas presupuestales.
          </p>
          <div class="format-card__tag">
            <span class="material-symbols-outlined">check_circle</span>
            <span>Incluye retenciones ZESE</span>
          </div>
          <div class="format-card__check" *ngIf="selectedFormat === 'excel'">
            <span class="material-symbols-outlined">check_circle</span>
          </div>
        </button>

        <!-- Option 2: PDF -->
        <button 
          class="format-card" 
          [class.format-card--active]="selectedFormat === 'pdf'"
          (click)="selectedFormat = 'pdf'">
          <div class="format-card__icon-wrap">
            <span class="material-symbols-outlined format-card__icon text-tertiary">picture_as_pdf</span>
          </div>
          <h3 class="format-card__title">Resumen PDF Contable</h3>
          <p class="format-card__desc">
            Documento formal listo para firma digital y presentación de informes mensuales ante contabilidad.
          </p>
          <div class="format-card__check" *ngIf="selectedFormat === 'pdf'">
            <span class="material-symbols-outlined">check_circle</span>
          </div>
        </button>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <button class="modal-btn modal-btn--cancel" (click)="onClose()">
        Cerrar
      </button>
      <button class="modal-btn modal-btn--primary" (click)="onExport()">
        <span class="material-symbols-outlined">download</span>
        Iniciar Descarga
      </button>
    </div>
    
    <!-- Branding Accent -->
    <div class="modal-accent"></div>
  </div>
</div>
