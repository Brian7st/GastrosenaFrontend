<div class="modal-overlay">
  <!-- Export Modal Container -->
  <div class="modal-content">
    
    <!-- Modal Header -->
    <div class="modal-header">
      <h3 class="modal-title">Exportar Historial de Movimientos</h3>
      <p class="modal-subtitle">Configure los parámetros para generar su reporte de entradas y salidas.</p>
    </div>

    <!-- Modal Body -->
    <form [formGroup]="exportForm" (ngSubmit)="onSubmit()" class="modal-body">
      
      <!-- Date Range Section -->
      <div class="form-section">
        <label class="section-label">Rango de Fechas</label>
        <div class="date-grid">
          <div class="input-wrapper">
            <lucide-icon name="calendar" class="input-icon" [size]="18"></lucide-icon>
            <input type="date" formControlName="fechaInicio" class="form-input">
          </div>
          <div class="input-wrapper">
            <lucide-icon name="calendar-days" class="input-icon" [size]="18"></lucide-icon>
            <input type="date" formControlName="fechaFin" class="form-input">
          </div>
        </div>
      </div>

      <!-- Filter by Type -->
      <div class="form-section">
        <label class="section-label">Tipo de Movimiento</label>
        <div class="chip-group">
          <button type="button" class="chip-btn" [class.active]="tipoSeleccionado === 'entradas'" (click)="setTipo('entradas')">
            Entradas
          </button>
          <button type="button" class="chip-btn" [class.active]="tipoSeleccionado === 'salidas'" (click)="setTipo('salidas')">
            Salidas
          </button>
          <button type="button" class="chip-btn" [class.active]="tipoSeleccionado === 'ambos'" (click)="setTipo('ambos')">
            Ambos
          </button>
        </div>
      </div>

      <!-- Format Selection -->
      <div class="form-section">
        <label class="section-label">Formato de Archivo</label>
        <div class="format-grid">
          
          <!-- Excel Card -->
          <div class="format-card" [class.selected]="formatoSeleccionado === 'excel'" (click)="setFormato('excel')">
            <div class="format-icon excel-icon">
              <lucide-icon name="file-spreadsheet" [size]="24"></lucide-icon>
            </div>
            <span class="format-title">Excel (.xlsx)</span>
            <div class="check-indicator" *ngIf="formatoSeleccionado === 'excel'">
              <lucide-icon name="check-circle" [size]="18"></lucide-icon>
            </div>
          </div>

          <!-- PDF Card -->
          <div class="format-card" [class.selected]="formatoSeleccionado === 'pdf'" (click)="setFormato('pdf')">
            <div class="format-icon pdf-icon">
              <lucide-icon name="file-text" [size]="24"></lucide-icon>
            </div>
            <span class="format-title">PDF (.pdf)</span>
            <div class="check-indicator" *ngIf="formatoSeleccionado === 'pdf'">
              <lucide-icon name="check-circle" [size]="18"></lucide-icon>
            </div>
          </div>

          <!-- CSV Card -->
          <div class="format-card" [class.selected]="formatoSeleccionado === 'csv'" (click)="setFormato('csv')">
            <div class="format-icon csv-icon">
              <lucide-icon name="file-type-csv" [size]="24"></lucide-icon>
            </div>
            <span class="format-title">CSV (.csv)</span>
            <div class="check-indicator" *ngIf="formatoSeleccionado === 'csv'">
              <lucide-icon name="check-circle" [size]="18"></lucide-icon>
            </div>
          </div>

        </div>
      </div>

      <!-- Modal Footer Buttons -->
      <div class="modal-footer">
        <restaurant-button variant="surface" (click)="closeModal()" type="button">Cancelar</restaurant-button>
        <restaurant-button variant="primary" type="submit" [disabled]="exportForm.invalid">
          <div style="display: flex; align-items: center; gap: 0.5rem; font-weight: bold;">
            <lucide-icon name="download" [size]="18"></lucide-icon>
            Exportar Reporte
          </div>
        </restaurant-button>
      </div>

    </form>
  </div>
</div>
