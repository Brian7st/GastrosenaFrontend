<div class="kpi-grid">
  <!-- Valor Total -->
  <div class="kpi-card">
    <div class="kpi-card__header">
      <div class="kpi-card__icon kpi-card__icon--primary">
        <restaurant-lucide-icon name="banknote" size="24"></restaurant-lucide-icon>
      </div>
      <span class="kpi-card__badge kpi-card__badge--success" *ngIf="kpis.tendenciaValor">
        +{{ kpis.tendenciaValor }}% vs mes anterior
      </span>
    </div>
    <p class="kpi-card__label">Valor Total Inventario</p>
    <h4 class="kpi-card__value">{{ kpis.valorTotal | currency:'USD':'symbol':'1.0-0' }}</h4>
  </div>

  <!-- Bienes en Alerta -->
  <div class="kpi-card">
    <div class="kpi-card__header">
      <div class="kpi-card__icon kpi-card__icon--danger">
        <restaurant-lucide-icon name="triangle-alert" size="24"></restaurant-lucide-icon>
      </div>
      <span class="kpi-card__badge kpi-card__badge--danger">Crítico</span>
    </div>
    <p class="kpi-card__label">Bienes en Alerta</p>
    <h4 class="kpi-card__value">{{ kpis.totalAlertas }} Items</h4>
  </div>

  <!-- Movimientos Recientes -->
  <div class="kpi-card">
    <div class="kpi-card__header">
      <div class="kpi-card__icon kpi-card__icon--info">
        <restaurant-lucide-icon name="refresh-cw" size="24"></restaurant-lucide-icon>
      </div>
      <span class="kpi-card__badge kpi-card__badge--info">Hoy</span>
    </div>
    <p class="kpi-card__label">Movimientos Recientes</p>
    <h4 class="kpi-card__value">{{ kpis.movimientosHoy }} Altas</h4>
  </div>
</div>
