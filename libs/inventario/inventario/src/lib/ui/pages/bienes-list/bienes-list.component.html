<restaurant-page-header
  title="Gestión de Bienes"
  subtitle="Control exhaustivo y trazabilidad de activos de formación."
>
  <div class="header-actions">
    <button class="btn-outline" (click)="onImportBienes()">
      <restaurant-lucide-icon name="upload" size="18"></restaurant-lucide-icon>
      Importar
    </button>
    <button class="btn-outline" (click)="onExportBienes()">
      <restaurant-lucide-icon name="download" size="18"></restaurant-lucide-icon>
      Exportar
    </button>
    <button class="btn-primary-gradient" (click)="onNuevoBien()">
      <restaurant-lucide-icon name="plus" size="18"></restaurant-lucide-icon>
      Nuevo Bien
    </button>
  </div>
</restaurant-page-header>

<div class="page-content">
  <!-- KPIs Section -->
  <restaurant-bien-kpi-cards *ngIf="kpis()" [kpis]="kpis()!"></restaurant-bien-kpi-cards>

  <!-- Filters Panel -->
  <div class="filters-panel">
    <div class="filters-panel__search">
      <restaurant-search-filter 
        placeholder="Buscar por código o nombre..."
        (search)="onSearch($event)">
      </restaurant-search-filter>
    </div>
    <div class="filters-panel__actions">
      <button class="btn-filter">
        <restaurant-lucide-icon name="filter" size="18"></restaurant-lucide-icon>
        Filtros Avanzados
      </button>
    </div>
  </div>

  <!-- Table Section -->
  <div class="table-section">
    <ng-container *ngIf="!loading(); else loadingTemplate">
      <restaurant-bien-table 
        [bienes]="bienes()"
        (edit)="onEditar($event)"
        (view)="onVerDetalle($event)"
        (delete)="onEliminar($event)">
      </restaurant-bien-table>
    </ng-container>

    <ng-template #loadingTemplate>
      <restaurant-loading-skeleton [rows]="5" [columns]="8"></restaurant-loading-skeleton>
    </ng-template>
  </div>
</div>

<!-- Modales -->
<restaurant-bien-form
  *ngIf="showFormModal()"
  [mode]="formMode()"
  [bien]="selectedBien()"
  (save)="onSaveBien($event)"
  (cancel)="showFormModal.set(false)"
></restaurant-bien-form>

<restaurant-keyword-confirm-modal
  [open]="showDeleteModal()"
  [title]="'Confirmar Eliminación'"
  [description]="'¿Desea eliminar permanentemente el bien ' + selectedBien()?.nombre + '? Esta acción no se puede deshacer.'"
  [identifierLabel]="'Código SENA'"
  [identifierValue]="selectedBien()?.codigoSena"
  (cancel)="showDeleteModal.set(false)"
  (confirm)="confirmarEliminacion()"
></restaurant-keyword-confirm-modal>

<restaurant-bien-import
  *ngIf="showImportModal()"
  (cancel)="showImportModal.set(false)"
  (import)="onProcessImport($event)"
></restaurant-bien-import>
