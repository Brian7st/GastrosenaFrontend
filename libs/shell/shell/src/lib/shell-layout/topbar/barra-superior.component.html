<header class="barra-superior">
  @if (enlaces.length > 0) {
    <nav class="barra-superior__nav">
      @for (enlace of enlaces; track enlace.ruta) {
        <a
          class="barra-superior__nav-link"
          [routerLink]="enlace.ruta"
          routerLinkActive="barra-superior__nav-link--activo"
        >
          {{ enlace.label }}
        </a>
      }
    </nav>
  }

  <div class="barra-superior__buscador-contenedor">
    <div class="barra-superior__buscador">
      <svg lucideSearch class="barra-superior__buscador-icono"></svg>
      <input class="barra-superior__buscador-input" [placeholder]="buscarPlaceholder" type="text" />
    </div>
  </div>

  <div class="barra-superior__acciones">
    <div class="barra-superior__herramientas">
      <button
        class="barra-superior__boton-icono barra-superior__boton-icono--ia"
        title="Asistente IA"
        type="button"
      >
        <svg lucideBrainCircuit></svg>
      </button>

      <button
        class="barra-superior__boton-icono"
        [title]="esOscuro() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        (click)="alternarTema()"
        type="button"
      >
        @if (esOscuro()) {
          <svg lucideSun></svg>
        } @else {
          <svg lucideMoon></svg>
        }
      </button>

      <!-- 🔔 Botón de notificaciones con enlace y badge -->
      <button class="barra-superior__boton-icono" routerLink="/app/notificaciones">
        <svg lucideBell></svg>
        @if (contadorNotificaciones() > 0) {
          <span class="barra-superior__badge">{{ contadorNotificaciones() }}</span>
        }
      </button>

      <!-- CAMBIADO: routerLink ahora apunta a /app/perfil -->
      <div class="barra-superior__perfil" routerLink="/app/perfil" style="cursor: pointer;">
        @if (perfil.avatarUrl) {
          <img
            [alt]="perfil.nombre || 'Usuario'"
            [src]="perfil.avatarUrl"
            class="barra-superior__img-perfil"
          />
        } @else {
          <svg lucideUser class="barra-superior__icono-perfil"></svg>
        }
      </div>
    </div>
  </div>
</header>
