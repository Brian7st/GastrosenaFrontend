<div class="layout-principal">
  <restaurant-barra-lateral
    [config]="sidebarConfig"
    [colapsada]="sidebarColapsada()"
    (expandir)="sidebarColapsada.set(false)"
  ></restaurant-barra-lateral>

  <main class="contenido-principal" [class.contenido-principal--colapsada]="sidebarColapsada()">
    <restaurant-barra-superior
      [perfil]="{ nombre: currentUser()?.nombre ?? 'Usuario autenticado', avatarUrl: '' }"
      [buscarPlaceholder]="'Buscar módulos, reportes o bienes...'"
      [enlaces]="topMenu"
      [sidebarColapsada]="sidebarColapsada()"
      (toggleSidebar)="toggleSidebar()"
    ></restaurant-barra-superior>

    <div class="contenido-principal__contenedor">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
