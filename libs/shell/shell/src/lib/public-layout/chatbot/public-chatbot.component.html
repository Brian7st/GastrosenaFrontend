<button class="chatbot-fab" (click)="toggle()" [class.open]="isOpen" aria-label="Asistente virtual">
  @if (!isOpen) {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
    </svg>
  } @else {
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <path d="M18 6L6 18M6 6l12 12"/>
    </svg>
  }
</button>

<div class="chatbot-window" [class.visible]="isOpen">
  <div class="chatbot-window__header">
    <div class="chatbot-window__avatar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
      </svg>
    </div>
    <div>
      <p class="chatbot-window__name">Asistente GastroSENA</p>
      <p class="chatbot-window__status"><span class="status-dot"></span> En línea</p>
    </div>
  </div>

  <div class="chatbot-window__body" #chatBody>
    @for (msg of messages; track $index) {
      <div class="chat-msg" [class.user]="msg.role === 'user'">
        <span>{{ msg.text }}</span>
      </div>
    }
    @if (showQuick) {
      <div class="chatbot-window__quick">
        @for (q of quickActions; track q) {
          <button class="quick-btn" (click)="sendQuick(q)">{{ q }}</button>
        }
      </div>
    }
  </div>

  <div class="chatbot-window__footer">
    <input type="text" placeholder="Escribe tu pregunta..."
           [(ngModel)]="inputText"
           (keyup.enter)="send()"
           class="chatbot-window__input">
    <button class="chatbot-window__send" (click)="send()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>

  <div class="chatbot-window__bar-actions">
    <button (click)="clearChat()">Limpiar Chat</button>
  </div>
</div>
