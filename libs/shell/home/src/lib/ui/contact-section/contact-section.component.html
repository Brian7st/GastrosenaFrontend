<section class="contact" id="contacto">
  <div class="container">
    <div class="contact__card">
      <div class="contact__header">
        <h2 class="contact__title">Información de Contacto</h2>
        <p class="contact__sub">Reserva tu mesa y vive la experiencia GastroSENA</p>
      </div>

      @if (contactInfo(); as info) {
        <div class="contact__grid">
          <div class="contact-item">
            <div class="contact-item__icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
              </svg>
            </div>
            <div>
              <h4 class="contact-item__label">Ubicación</h4>
              <p class="contact-item__value">{{ info.address }}</p>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-item__icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 .18h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 8.09a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/>
              </svg>
            </div>
            <div>
              <h4 class="contact-item__label">Teléfono</h4>
              <p class="contact-item__value">{{ info.phone }}</p>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-item__icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/>
              </svg>
            </div>
            <div>
              <h4 class="contact-item__label">Email</h4>
              <p class="contact-item__value">{{ info.email }}</p>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-item__icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
              </svg>
            </div>
            <div>
              <h4 class="contact-item__label">Horarios</h4>
              <p class="contact-item__value">{{ info.schedule }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
