<section class="section" id="bar">
  <div class="container">
    <restaurant-section-title
      title="Bar & Coctelería"
      subtitle="Cócteles de autor y bebidas signature preparados por nuestros aprendices de barismo y coctelería."
    />
    <div class="items-grid">
      @for (item of items(); track item.id) {
        <restaurant-card
          [title]="item.title"
          [subtitle]="item.description"
          [imageUrl]="item.imageUrl ?? ''"
          [price]="item.price ?? null"
        />
      }
    </div>
  </div>
</section>
